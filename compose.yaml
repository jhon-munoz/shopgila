services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopgila}
      POSTGRES_USER: ${POSTGRES_USER:-shopgila}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopgila}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-shopgila}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-shopgila}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-shopgila}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  db-data:
